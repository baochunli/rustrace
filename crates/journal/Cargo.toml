[package]
name = "rustrace-journal"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
blake3 = "=1.8.7"
chrono = { version = "=0.4.42", default-features = false, features = ["serde", "std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "limits"] }
rustrace-model = { path = "../model" }
rustrace-workspace = { path = "../workspace" }

[features]
process-probes = []
