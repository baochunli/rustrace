[package]
name = "rustrace-workspace"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
blake3 = "=1.8.7"
crc32fast = "=1.5.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "=0.3.3"
globset = "=0.4.16"
rustrace-model = { path = "../model" }
rustix = { version = "=1.1.2", features = ["fs"] }
toml = "=0.8.23"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.24"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[features]
process-probes = []
